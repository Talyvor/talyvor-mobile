name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0 (node24)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # B58.19 — what ships in the app; a high or critical advisory fails the build. B66.2: except scripts/audit-allow.txt.
      - run: node scripts/check-audit.js
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  # The native projects for each platform, generated from app.json, and the app's JavaScript bundled for it.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0 (node24)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ${{ matrix.platform }} --no-install
      - if: matrix.platform == 'ios'
        run: node scripts/check-privacy-manifest.js ios
      - run: npx expo export --platform ${{ matrix.platform }}
      # B43.41 — ubuntu-26.04 has no JAVA_HOME_17_X64, so JAVA_HOME was empty and Gradle took the image's default JDK and
      # fetched every plugin from the portal on every run; one unlucky runner could not resolve foojay-resolver-convention.
      # A real JDK 17, and ~/.gradle cached on the generated android/ build files, so a plugin is fetched once and reused.
      - if: matrix.platform == 'android'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      # The Android widget's provider is Kotlin written by plugins/with-android-widget-links.js; only a compile proves it.
      - if: matrix.platform == 'android'
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon
