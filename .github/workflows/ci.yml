name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # B58.19 — what ships in the app; a high or critical advisory fails the build.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  # The native projects for each platform, generated from app.json, and the app's JavaScript bundled for it.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ${{ matrix.platform }} --no-install
      - if: matrix.platform == 'ios'
        run: node scripts/check-privacy-manifest.js ios
      - run: npx expo export --platform ${{ matrix.platform }}
      # The Android widget's provider is Kotlin written by plugins/with-android-widget-links.js; only a compile proves it.
      - if: matrix.platform == 'android'
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew :app:compileDebugKotlin --no-daemon
